<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IV</title>
    <link rel="stylesheet" href="/Design/signup.css">
</head>
<body>

    <form id="signupform">
        <h1>Sign-up</h1>
       <div id="signupform-controls">
        <label for="username">First Name</label>
        <input id="formcontrols-signup" type="username" name="Username" id="username" required>
        <label for="lastname">Last Name</label>
        <input id="formcontrols-signup" type="text" name="lastname" id="lastname"required>
        <label for="email">E-Mail</label>
        <input id="formcontrols-signup" type="email" name="email" id="email" required>
        <label for="password" >Password</label>
        <input id="formcontrols-signup" type="password" name="password" id="password" required>
        <label for="confirmpassword">Confirm password</label>
        <input id="formcontrols-signup" type="password" name="confirmpassword" id="confirmpassword" required>
        <input id="submitform" onclick="submitform()" type="submit" value="Sign-up">
       </div>
    </form>
    
</body>
</html>
